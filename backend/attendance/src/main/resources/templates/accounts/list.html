<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Accounts — Lab Attendance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <h2>Login Accounts</h2>
    <p class="text-muted">
        Authentication accounts (the <code>users</code> table). Create a PROFESSOR
        login here and optionally link it to a Professor directory record.
        This is separate from <a th:href="@{/professors}">Professors</a> (schedule
        directory entries, no login).
    </p>

    <div class="card mb-4" style="max-width:720px">
        <div class="card-header">New account</div>
        <div class="card-body">
            <form th:action="@{/accounts}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autocomplete="off"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="text" name="password" class="form-control" required autocomplete="new-password"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-select">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                th:selected="${r.name() == 'PROFESSOR'}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Linked professor <span class="text-muted">(optional)</span></label>
                    <select name="professorId" class="form-select">
                        <option value="">— none —</option>
                        <option th:each="p : ${professors}"
                                th:value="${p.id}"
                                th:text="${p.title + ' ' + p.fullName}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Create account</button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/search :: table('#accountsTable', 'Search by username, role or professor…')}"></div>

    <table id="accountsTable" class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Linked professor</th>
            <th style="width:42%">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="account : ${accounts}">
            <td th:text="${account.username}">user</td>
            <td><span class="badge bg-secondary" th:text="${account.role}">ROLE</span></td>
            <td th:text="${account.professor != null ? account.professor.title + ' ' + account.professor.fullName : '—'}">—</td>
            <td>
                <form th:action="@{'/accounts/' + ${account.id} + '/reset-password'}" method="post"
                      class="d-inline-flex gap-1 me-2">
                    <input type="text" name="newPassword" class="form-control form-control-sm"
                           style="width:160px" placeholder="new password" required autocomplete="off"/>
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Reset</button>
                </form>
                <form th:action="@{'/accounts/' + ${account.id} + '/delete'}" method="post" class="d-inline"
                      onsubmit="return confirm('Delete this account?');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${accounts.isEmpty()}">
            <td colspan="4" class="text-muted">No accounts.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Student — Lab Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container mt-4" style="max-width:760px">
    <h2>Edit Student</h2>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="card mb-4">
        <div class="card-header">Profile</div>
        <div class="card-body">
            <form th:action="@{/students/{id}/edit(id=${student.id})}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Matricol Number</label>
                        <input type="text" name="matricolNumber" class="form-control"
                               th:value="${form.matricolNumber()}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="fullName" class="form-control"
                               th:value="${form.fullName()}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" th:value="${form.email()}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Year of Study</label>
                        <input type="number" name="yearOfStudy" class="form-control" min="1" max="6"
                               th:value="${form.yearOfStudy()}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Primary Group</label>
                        <select name="primaryGroupId" class="form-select">
                            <option value="">— None —</option>
                            <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.name}"
                                    th:selected="${form.primaryGroupId() != null and form.primaryGroupId() == g.id}"></option>
                        </select>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a th:href="@{/students}" class="btn btn-outline-secondary">Back</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Fingerprint Data</div>
        <div class="card-body">
            <p class="mb-3">
                <span th:if="${fingerprintCount > 0}" class="badge bg-success"
                      th:text="${fingerprintCount} + ' registration(s) on file'"></span>
                <span th:unless="${fingerprintCount > 0}" class="badge bg-secondary">No fingerprint data</span>
            </p>
            <form id="resetForm" th:action="@{/students/{id}/reset-fingerprint(id=${student.id})}" method="post">
                <button type="button" class="btn btn-warning" id="resetBtn" th:disabled="${fingerprintCount == 0}">
                    Reset Fingerprint
                </button>
            </form>
        </div>
    </div>

    <div class="card border-danger mb-4">
        <div class="card-header bg-danger text-white">Danger Zone</div>
        <div class="card-body">
            <p class="small text-muted mb-3">
                Hard-delete removes the student row permanently, together with their
                fingerprint data, scan events and consent records (GDPR erasure).
                Use <em>Deactivate</em> on the list page if you want to keep the audit history.
            </p>
            <form id="deleteForm" th:action="@{/students/{id}/delete(id=${student.id})}" method="post">
                <button type="button" class="btn btn-outline-danger" id="deleteBtn">Delete Student</button>
            </form>
        </div>
    </div>
</div>

<!-- Confirmation modal (page-styled, replaces window.confirm) -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmModalTitle">Confirm</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="confirmModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmModalBtn">Confirm</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    const modalEl = document.getElementById('confirmModal');
    const modal   = new bootstrap.Modal(modalEl);
    const titleEl = document.getElementById('confirmModalTitle');
    const bodyEl  = document.getElementById('confirmModalBody');
    const okEl    = document.getElementById('confirmModalBtn');
    let pending = null;

    function ask(title, body, btnClass, onConfirm) {
        titleEl.textContent = title;
        bodyEl.textContent  = body;
        okEl.className = 'btn ' + btnClass;
        pending = onConfirm;
        modal.show();
    }

    const resetBtn = document.getElementById('resetBtn');
    if (resetBtn) {
        resetBtn.addEventListener('click', () => ask(
            'Reset fingerprint',
            'Delete all fingerprint registrations for this student? Audit rows (scan events) are preserved. The student can re-register afterwards.',
            'btn-warning',
            () => document.getElementById('resetForm').submit()));
    }

    const deleteBtn = document.getElementById('deleteBtn');
    if (deleteBtn) {
        deleteBtn.addEventListener('click', () => ask(
            'Delete student',
            'Permanently delete this student, including fingerprint data and scan history? This cannot be undone.',
            'btn-danger',
            () => document.getElementById('deleteForm').submit()));
    }

    okEl.addEventListener('click', () => { if (pending) pending(); });
})();
</script>
</body>
</html>

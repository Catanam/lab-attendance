<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Courses — Lab Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container mt-4">
    <h2>Courses</h2>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="card mb-4">
        <div class="card-header">Add Course</div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(professors)}" class="alert alert-warning mb-0">
                Add a professor first — a course cannot exist without one.
                <a th:href="@{/professors}" class="alert-link">Go to Professors</a>.
            </div>
            <form th:unless="${#lists.isEmpty(professors)}" th:action="@{/courses}" method="post" class="row g-2">
                <div class="col-md-3">
                    <input type="text" name="code" class="form-control" placeholder="Code (e.g. CS101)" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="name" class="form-control" placeholder="Course name" required>
                </div>
                <div class="col-md-3">
                    <select name="professorId" class="form-select" required>
                        <option value="">— Professor —</option>
                        <option th:each="p : ${professors}" th:value="${p.id}" th:text="${p.fullName}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/search :: table('#coursesTable', 'Search by code, name or professor…')}"></div>

    <table id="coursesTable" class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr><th>Code</th><th>Name</th><th>Professor</th><th></th></tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(courses)}">
                <td colspan="4" class="text-center text-muted py-4">No courses yet.</td>
            </tr>
            <tr th:each="c : ${courses}">
                <td th:text="${c.code}"></td>
                <td th:text="${c.name}"></td>
                <td th:text="${teachersByCourse.get(c.id)} ?: '—'" class="text-muted small">—</td>
                <td class="text-end">
                    <a th:href="@{/courses/{id}/edit(id=${c.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <form th:action="@{/courses/{id}/delete(id=${c.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this course?')">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Groups — Lab Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container mt-4">
    <h2>Student Groups</h2>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="card mb-4">
        <div class="card-header">Add Group</div>
        <div class="card-body">
            <form th:action="@{/groups}" method="post" class="row g-2">
                <div class="col-md-5">
                    <input type="text" name="name" class="form-control" placeholder="Group name (e.g. 331A)" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="year" class="form-control" placeholder="Year (e.g. 3)">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/search :: table('#groupsTable', 'Search by group name or year…')}"></div>

    <table id="groupsTable" class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr><th>Name</th><th>Year</th><th></th></tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(groups)}">
                <td colspan="3" class="text-center text-muted py-4">No groups yet.</td>
            </tr>
            <tr th:each="g : ${groups}">
                <td th:text="${g.name}"></td>
                <td th:text="${g.year}"></td>
                <td class="text-end">
                    <a th:href="@{/groups/{id}/edit(id=${g.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <form th:action="@{/groups/{id}/delete(id=${g.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this group?')">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

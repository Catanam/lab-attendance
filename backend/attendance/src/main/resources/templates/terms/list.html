<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Academic Terms — Lab Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container mt-4">
    <h2>Academic Terms</h2>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="card mb-4">
        <div class="card-header">Add Term</div>
        <div class="card-body">
            <form th:action="@{/terms}" method="post" class="row g-2">
                <div class="col-md-2">
                    <input type="text" name="code" class="form-control" placeholder="Code (e.g. 2025-2)" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="name" class="form-control" placeholder="Name (e.g. Sem 2 2024-2025)" required>
                </div>
                <div class="col-md-2">
                    <input type="date" name="startDate" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <input type="date" name="endDate" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/search :: table('#termsTable', 'Search by code or name…')}"></div>

    <table id="termsTable" class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr><th>Code</th><th>Name</th><th>Start</th><th>End</th><th>Current</th><th></th></tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(terms)}">
                <td colspan="6" class="text-center text-muted py-4">No terms yet.</td>
            </tr>
            <tr th:each="t : ${terms}">
                <td th:text="${t.code}"></td>
                <td th:text="${t.name}"></td>
                <td th:text="${t.startDate}"></td>
                <td th:text="${t.endDate}"></td>
                <td>
                    <span th:if="${t.current}" class="badge bg-success">Current</span>
                    <form th:unless="${t.current}" th:action="@{/terms/{id}/set-current(id=${t.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-success">Set current</button>
                    </form>
                </td>
                <td class="text-end">
                    <a th:href="@{/terms/{id}/edit(id=${t.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <form th:action="@{/terms/{id}/delete(id=${t.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this term?')">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

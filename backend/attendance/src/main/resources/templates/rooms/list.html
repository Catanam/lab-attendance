<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rooms — Lab Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container mt-4">
    <h2>Rooms</h2>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="card mb-4">
        <div class="card-header">Add Room</div>
        <div class="card-body">
            <form th:action="@{/rooms}" method="post" class="row g-2">
                <div class="col-md-4">
                    <input type="text" name="name" class="form-control" placeholder="Room name (e.g. C101)" required>
                </div>
                <div class="col-md-5">
                    <input type="text" name="building" class="form-control" placeholder="Building">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/search :: table('#roomsTable', 'Search by room name or building…')}"></div>

    <table id="roomsTable" class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr><th>Name</th><th>Building</th><th></th></tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(rooms)}">
                <td colspan="3" class="text-center text-muted py-4">No rooms yet.</td>
            </tr>
            <tr th:each="r : ${rooms}">
                <td th:text="${r.name}"></td>
                <td th:text="${r.building}"></td>
                <td class="text-end">
                    <a th:href="@{/rooms/{id}/edit(id=${r.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <form th:action="@{/rooms/{id}/delete(id=${r.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this room?')">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

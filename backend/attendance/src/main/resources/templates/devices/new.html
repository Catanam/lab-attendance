<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>New Device</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container mt-4" style="max-width:500px">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <h2>New Device</h2>
    <form th:action="@{/devices/new}" method="post">
        <div class="mb-3">
            <label class="form-label">Room</label>
            <select name="roomId" class="form-select" required>
                <option value="">— select room —</option>
                <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.name}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Generate &amp; Create</button>
        <a th:href="@{/devices}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
    <p class="text-muted mt-3 small">A random secret is generated and shown once after creation. Copy it into the firmware provisioning menu.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

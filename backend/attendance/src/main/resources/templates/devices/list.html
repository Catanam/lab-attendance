<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Devices</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Devices</h2>
        <a th:href="@{/devices/new}" class="btn btn-primary" sec:authorize="hasRole('SUPER_ADMIN')">+ New Device</a>
    </div>

    <div th:replace="~{fragments/search :: table('#devicesTable', 'Search by device ID, room or status…')}"></div>

    <table id="devicesTable" class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Device ID</th>
            <th>Room</th>
            <th>Status</th>
            <th>Last Seen</th>
            <th>Online</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${devices}">
            <td th:text="${d.id}" class="font-monospace small"></td>
            <td th:text="${d.room.name}"></td>
            <td>
                <span th:if="${d.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                <span th:if="${d.status.name() == 'REVOKED'}" class="badge bg-danger">REVOKED</span>
            </td>
            <td th:text="${d.lastSeenAt != null ? #temporals.format(d.lastSeenAt, 'yyyy-MM-dd HH:mm') : '—'}"></td>
            <td>
                <!-- Online = last_seen_at within the last 2 minutes -->
                <span th:if="${d.lastSeenAt != null and #temporals.createNow().minusMinutes(2).isBefore(d.lastSeenAt)}"
                      class="badge bg-success">ONLINE</span>
                <span th:unless="${d.lastSeenAt != null and #temporals.createNow().minusMinutes(2).isBefore(d.lastSeenAt)}"
                      class="badge bg-secondary">OFFLINE</span>
            </td>
            <td>
                <form th:if="${d.status.name() == 'ACTIVE'}"
                      th:action="@{/devices/{id}/revoke(id=${d.id})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-danger"
                            onclick="return confirm('Revoke this device?')">Revoke</button>
                </form>
                <form th:if="${d.status.name() == 'REVOKED'}"
                      th:action="@{/devices/{id}/activate(id=${d.id})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-success">Activate</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(devices)}">
            <td colspan="6" class="text-center text-muted">No devices registered yet.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

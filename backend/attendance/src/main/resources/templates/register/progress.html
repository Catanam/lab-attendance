<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Registration in Progress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container mt-4" style="max-width:600px">
    <h2>Registering: <span th:text="${student?.fullName}">Student</span></h2>
    <p class="text-muted">Have the student press their finger on the sensor. Move finger between samples.</p>

    <div class="mb-3">
        <div class="progress" style="height:28px">
            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated"
                 role="progressbar" style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="6">
                0 / 6
            </div>
        </div>
    </div>

    <div id="statusMsg" class="alert alert-info">Waiting for first scan…</div>

    <ul id="log" class="list-group mb-3"></ul>

    <div id="doneSection" style="display:none">
        <div class="alert alert-success fw-bold">Registration complete!</div>
        <a th:href="@{/register}" class="btn btn-primary">Register another</a>
    </div>

    <form th:action="@{/register/cancel}" method="post" id="cancelForm">
        <input type="hidden" name="roomId" th:value="${roomId}"/>
        <button type="submit" class="btn btn-outline-danger" id="cancelBtn">Cancel</button>
    </form>
</div>

<script>
const roomId = '[[${roomId}]]';
const evtSource = new EventSource('/register/events?roomId=' + roomId);
const bar = document.getElementById('progressBar');
const status = document.getElementById('statusMsg');
const log = document.getElementById('log');

function addLog(msg, cls) {
    const li = document.createElement('li');
    li.className = 'list-group-item ' + (cls || '');
    li.textContent = msg;
    log.prepend(li);
}

evtSource.addEventListener('progress', e => {
    const d = JSON.parse(e.data);
    const pct = Math.round(d.sampleCount / 6 * 100);
    bar.style.width = pct + '%';
    bar.textContent = d.sampleCount + ' / 6';
    bar.setAttribute('aria-valuenow', d.sampleCount);
    status.className = 'alert alert-info';
    status.textContent = d.message;
    addLog(d.message, 'list-group-item-success');
});

evtSource.addEventListener('duplicate', e => {
    const d = JSON.parse(e.data);
    status.className = 'alert alert-warning';
    status.textContent = d.message;
    addLog('⚠ ' + d.message, 'list-group-item-warning');
});

evtSource.addEventListener('complete', e => {
    const d = JSON.parse(e.data);
    bar.style.width = '100%';
    bar.textContent = '6 / 6';
    bar.classList.remove('progress-bar-animated');
    bar.classList.add('bg-success');
    status.className = 'alert alert-success fw-bold';
    status.textContent = d.message;
    addLog('✓ ' + d.message, 'list-group-item-success');
    document.getElementById('doneSection').style.display = 'block';
    document.getElementById('cancelForm').style.display = 'none';
    evtSource.close();
});

evtSource.addEventListener('error', e => {
    try {
        const d = JSON.parse(e.data);
        status.className = 'alert alert-danger';
        status.textContent = 'Error: ' + d.message;
        addLog('✗ ' + d.message, 'list-group-item-danger');
    } catch(_) {}
    evtSource.close();
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Professors — Lab Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container mt-4">
    <h2>Professors</h2>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="card mb-4">
        <div class="card-header">Add Professor</div>
        <div class="card-body">
            <form th:action="@{/professors}" method="post" class="row g-2">
                <div class="col-md-2">
                    <input type="text" name="title" class="form-control" placeholder="Title (e.g. Prof.)">
                </div>
                <div class="col-md-3">
                    <input type="text" name="fullName" class="form-control" placeholder="Full name" required>
                </div>
                <div class="col-md-3">
                    <input type="email" name="email" class="form-control" placeholder="Email">
                </div>
                <div class="col-md-2">
                    <input type="text" name="officeRoom" class="form-control" placeholder="Office room">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </div>
                <div class="col-12">
                    <input type="text" name="officeHours" class="form-control" placeholder="Office hours (e.g. Mon 10-12)">
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/search :: table('#professorsTable', 'Search by name, email or office…')}"></div>

    <table id="professorsTable" class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Title</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Office</th>
                <th>Hours</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(professors)}">
                <td colspan="6" class="text-center text-muted py-4">No professors yet.</td>
            </tr>
            <tr th:each="p : ${professors}">
                <td th:text="${p.title}"></td>
                <td th:text="${p.fullName}"></td>
                <td th:text="${p.email}"></td>
                <td th:text="${p.officeRoom}"></td>
                <td th:text="${p.officeHours}"></td>
                <td class="text-end">
                    <a th:href="@{/professors/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <form th:action="@{/professors/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this professor?')">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

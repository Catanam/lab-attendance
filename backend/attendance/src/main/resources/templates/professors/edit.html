<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Professor — Lab Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container mt-4" style="max-width:540px">
    <h2>Edit Professor</h2>
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <form th:action="@{/professors/{id}/edit(id=${professor.id})}" method="post">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" th:value="${form.title()}">
        </div>
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="fullName" class="form-control" th:value="${form.fullName()}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" th:value="${form.email()}">
        </div>
        <div class="mb-3">
            <label class="form-label">Office Room</label>
            <input type="text" name="officeRoom" class="form-control" th:value="${form.officeRoom()}">
        </div>
        <div class="mb-3">
            <label class="form-label">Office Hours</label>
            <input type="text" name="officeHours" class="form-control" th:value="${form.officeHours()}">
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/professors}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

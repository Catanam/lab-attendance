<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>All Attendance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container-fluid mt-4 px-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">All Attendance <span class="text-muted fs-6">(every day)</span></h2>
        <a th:href="@{/prof}" class="btn btn-outline-secondary btn-sm">← Today's sessions</a>
    </div>

    <form th:action="@{/prof/attendance}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-auto">
            <label class="form-label small mb-0">Course</label>
            <select name="courseId" class="form-select form-select-sm" onchange="this.form.submit()">
                <option th:each="c : ${courses}" th:value="${c.id}"
                        th:selected="${selectedCourseId != null and selectedCourseId == c.id}"
                        th:text="${c.code + ' — ' + c.name}">CS101 — Course</option>
            </select>
        </div>
        <div class="col-auto">
            <label class="form-label small mb-0">From</label>
            <input type="date" name="from" class="form-control form-control-sm" th:value="${from}"/>
        </div>
        <div class="col-auto">
            <label class="form-label small mb-0">To</label>
            <input type="date" name="to" class="form-control form-control-sm" th:value="${to}"/>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary btn-sm">Apply</button>
            <a th:href="@{/prof/attendance}" class="btn btn-outline-secondary btn-sm">Clear</a>
        </div>
        <div class="col-auto ms-auto">
            <a th:href="@{/prof/attendance/export.xlsx(from=${from},to=${to},courseId=${selectedCourseId})}"
               class="btn btn-success btn-sm">⬇ Excel (.xlsx)</a>
            <a th:href="@{/prof/attendance/export.csv(from=${from},to=${to},courseId=${selectedCourseId})}"
               class="btn btn-outline-success btn-sm">⬇ CSV (.csv)</a>
        </div>
    </form>

    <p class="text-muted small"
       th:text="${#lists.size(pivot.students)} + ' student(s) × ' + ${#lists.size(pivot.days)} + ' day(s)'">0 × 0</p>

    <!-- Matrix: students down the rows, one column per session date (newest to the right).
         Cell = that student's status that day. Horizontal scroll as days accumulate. -->
    <div class="table-responsive">
        <table class="table table-sm table-bordered align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th class="text-start" style="position:sticky;left:0;background:inherit;">Matricol</th>
                <th class="text-start">Student</th>
                <th th:each="day : ${pivot.days}"
                    th:title="${day}"
                    th:text="${#temporals.format(day,'dd.MM')}">01.06</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${pivot.students}">
                <td class="text-start text-muted small" style="position:sticky;left:0;background:#fff;"
                    th:text="${row.matricolNumber != null and !row.matricolNumber.startsWith('name:')} ? ${row.matricolNumber} : '—'">123</td>
                <td class="text-start fw-semibold" th:text="${row.fullName}">Name</td>
                <td th:each="day : ${pivot.days}" th:with="st=${row.byDay.get(day)}">
                    <span th:if="${st != null and st.name() == 'PRESENT'}" class="badge bg-success">P</span>
                    <span th:if="${st != null and st.name() == 'LATE'}" class="badge bg-warning text-dark">L</span>
                    <span th:if="${st != null and st.name() == 'ABSENT'}" class="badge bg-secondary">A</span>
                    <span th:if="${st == null}" class="text-muted">·</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pivot.students)}">
                <td th:colspan="${#lists.size(pivot.days) + 2}" class="text-center text-muted">
                    No attendance records in this range.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="small text-muted">
        <span class="badge bg-success">P</span> present
        <span class="badge bg-warning text-dark ms-2">L</span> late
        <span class="badge bg-secondary ms-2">A</span> absent
        <span class="ms-2">·</span> no session
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
